name: Claude Code

# Single source of truth for the general @claude assistant: any @claude mention
# by brandonwie except "@claude review", which claude-review.yml handles, in
# issue comments (PRs included), PR review comments, PR review bodies, and new
# or assigned issues. Claude acts on the triggering comment; there is no custom
# prompt. Token routing matches claude-review.yml: work repositories read the
# `brandonwie` environment, personal repositories the repository secret.
#
# Security: event bodies and titles appear only in the job-level `if:`
# expression. They are never interpolated into a shell command.
#
# Keep the claude-code-action and checkout pins identical to claude-review.yml;
# pin-check.yml fails the push otherwise.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Pass it from every stub. The `brandonwie` environment secret takes
          precedence in work repositories.
        required: false

jobs:
  claude:
    if: >-
      github.actor == 'brandonwie'
      && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review'))
        || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
        || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        || (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    environment: ${{ github.repository_owner != 'brandonwie' && 'brandonwie' || '' }}
    # A caller job must grant at least these; a called job can only narrow them.
    permissions:
      contents: write # @claude may be asked to fix typos or amend docs
      pull-requests: write
      issues: write
      id-token: write
      actions: read # read CI results when troubleshooting

    steps:
      - name: Validate Claude token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ENV_NAME: ${{ github.repository_owner != 'brandonwie' && 'brandonwie' || '' }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty (environment: '${ENV_NAME:-none}'). Pass it in the stub's secrets: block, and set it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo $GITHUB_REPOSITORY${ENV_NAME:+ --env $ENV_NAME}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
