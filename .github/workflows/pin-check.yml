name: Pin check

# Every workflow in this repository must pin the same claude-code-action and
# checkout commit, so every caller runs one version. Bump both workflows in one
# commit; this check fails the push when they drift or use a non-SHA ref. It
# also runs the sync-token.sh routing test.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-pins.sh
      - run: bash scripts/test-sync-token.sh
      - run: bash scripts/test-add-reviewer.sh
